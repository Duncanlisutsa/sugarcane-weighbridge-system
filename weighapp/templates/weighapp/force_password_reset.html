{% extends 'weighapp/base.html' %}
{% block title %}Set Your Password{% endblock %}
{% block content %}

<div class="card" style="max-width:480px; margin: 40px auto;">
    <h2>🔑 Set a New Password</h2>

    <div class="alert alert-info" style="margin-bottom:20px;">
        For your security, you must set your own password before you can
        continue using the system.
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password"
                   placeholder="The password you just logged in with" required autofocus>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password"
                   placeholder="Minimum 8 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Repeat the new password" required>
        </div>

        <button type="submit" class="btn btn-green" style="width:100%; margin-top:8px;">
            Set Password &amp; Continue
        </button>
    </form>
</div>

{% endblock %}
