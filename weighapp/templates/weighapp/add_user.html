{% extends 'weighapp/base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}

<div class="card" style="max-width:520px;">
    <h2>Add New User</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="e.g. Mary Achieng" required>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   placeholder="e.g. machieng" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email"
                   placeholder="e.g. machieng@weighbridge.com">
        </div>

        <div class="form-group">
            <label>Role</label>
            <select name="role" required>
                <option value="">-- Select Role --</option>
                <option value="clerk">Clerk</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" name="password" class="password-strength"
                       placeholder="Minimum 8 characters" required>
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)"></button>
            </div>
            <ul class="password-requirements">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="upper">One uppercase letter</li>
                <li data-rule="lower">One lowercase letter</li>
                <li data-rule="special">One special character</li>
            </ul>
        </div>

        <div style="display:flex; gap:12px; margin-top:8px;">
            <button type="submit" class="btn btn-green">
                Create User
            </button>
            <a href="{% url 'manage_users' %}"
               class="btn btn-gray">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
