{% extends 'weighapp/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<div class="card" style="max-width:480px;">
    <h2>🔑 Reset Password</h2>

    <div class="alert alert-info" style="margin-bottom:20px;">
        Resetting password for <strong>{{ target_user.full_name }}</strong>
        ({{ target_user.role|title }})
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password"
                   placeholder="Minimum 8 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Repeat the new password" required>
        </div>

        <div style="display:flex; gap:12px; margin-top:8px;">
            <button type="submit" class="btn btn-green">
                Reset Password
            </button>
            <a href="{% url 'manage_users' %}"
               class="btn btn-gray">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
